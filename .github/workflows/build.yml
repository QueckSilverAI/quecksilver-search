name: Build desktop installers

# Builds the .exe (Windows), .dmg (macOS), and AppImage/.deb (Linux)
# installers on their own native OS each — macOS builds specifically need
# to run on an actual Mac (Apple doesn't support cross-building/signing a
# .dmg from Windows or Linux reliably), which is exactly what GitHub's
# hosted macos-latest runner gives us for free, without needing to own a
# Mac.
#
# On a version tag push (e.g. `git tag v1.0.0 && git push --tags`), the
# three finished installers are attached to a GitHub Release for that tag
# automatically — that Release page is what quecksilver.ch's own download
# page should link to (each asset gets a stable, permanent, directly
# downloadable URL like
# github.com/<you>/<repo>/releases/download/v1.0.0/<file>).
#
# workflow_dispatch (the "Run workflow" button in the Actions tab) builds
# everything the same way but without creating a Release — useful for
# testing the build itself without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-glob: release/*.exe
          - os: macos-latest
            artifact-glob: release/*.dmg
          - os: ubuntu-latest
            artifact-glob: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # Builds the chrome UI (nitro node-server, see vite.config.ts) AND
      # the electron main/preload bundles, then runs electron-builder for
      # whichever OS this job is running on — electron-builder auto-
      # detects the host platform's own target(s) from package.json's
      # "build" config (mac/win/linux) unless told otherwise.
      - run: npm run electron:pack

      - uses: actions/upload-artifact@v4
        with:
          name: queck-silver-search-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    # Only for an actual version tag — workflow_dispatch runs stop after
    # the build job, nothing gets published from a manual test run.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release with all installers attached
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          draft: true
          generate_release_notes: true
